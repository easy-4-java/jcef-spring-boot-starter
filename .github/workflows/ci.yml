name: CI

on:
  push:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x]
  pull_request:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x]

permissions:
  contents: read

jobs:
  build:
    uses: easy-4-java/.github/.github/workflows/maven-starter-ci.yml@main
    # This line uses POM model 4.1.0; select the reusable job's Maven 4 wrapper path.
    with:
      version-line: 4.1.x
    secrets: inherit
